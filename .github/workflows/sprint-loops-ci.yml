name: sprint-loops-ci

# Generated by Sprint Loops at substrate convergence. This project owns
# the file now: edit it freely, and deleting it is permanent because
# generation is create-if-absent.

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  rust:
    # Two operating systems, deliberately. INT-0001 has two acceptance
    # criteria that cannot both be exercised on one platform: symlinks are
    # never traversed (Windows refuses to create a directory symlink without
    # elevated privileges, so that test self-skips there), and output paths
    # use `/` on every platform (only meaningful on Windows). A single-OS
    # pipeline would leave one of them verified nowhere.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # --nocapture so a platform-gated test's SKIP line is visible in the log
      # rather than silently passing.
      - run: cargo test --all -- --nocapture
